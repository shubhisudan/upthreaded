<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailor Requests - UpThreaded</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/stylesheets/style.css">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement(
                {pageLanguage: 'en', includedLanguages: 'hi,ta,te,kn,ml,bn,gu,mr,pa,ur'},
                'google_translate_element'
            );
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap');

        :root {
            --primary-color: #285A84;
            --secondary-color: #1d4361;
            --accent-color: #4CAF50;
            --text-color: #333;
            --light-bg: #f8f9fa;
        }

        /* Google Translate Styles */
        .goog-te-gadget {
            font-family: 'Ubuntu', sans-serif !important;
            text-transform: none !important;
        }
        .goog-te-gadget-simple {
            background-color: transparent !important;
            border: 1px solid rgba(255, 255, 255, 0.5) !important;
            padding: 8px !important;
            border-radius: 4px !important;
            cursor: pointer !important;
        }
        .goog-te-menu-value {
            color: white !important;
            text-decoration: none !important;
        }
        .goog-te-menu-value span {
            color: white !important;
        }
        .goog-te-menu-value:hover {
            text-decoration: none !important;
        }
        .goog-te-gadget .goog-te-combo {
            background-color: transparent !important;
            color: rgb(0, 0, 0) !important;
            border: none !important;
            padding: 5px !important;
        }
        .goog-te-banner-frame {
            display: none !important;
        }
        body {
            top: 0 !important;
        }
    </style>
    <link rel="stylesheet" href="/stylesheets/style.css">
    <link rel="stylesheet" href="/stylesheets/tailor-dashboard.css">
</head>

<body>
    <div class="dashboard-container">
        <nav class="dashboard-nav">
            <div class="nav-logo">Upthreaded</div>
            <ul class="nav-links">
                <li><a href="profile.html">Profile</a></li>
                <li><a href="requests.html" class="active">Requests</a></li>
                <li><a href="orders.html">Orders</a></li>
                <li><a href="/tailor">Back to Main</a></li>
                <li><a href="/logout" class="logout-link">Logout</a></li>
                <li>
                    <div id="google_translate_element"></div>
                </li>
            </ul>
        </nav>

        <main class="dashboard-content">
            <div class="requests-header">
                <h1>Tailor Requests</h1>
                <div class="request-filters">
                    <select id="statusFilter">
                        <option value="all">All Requests</option>
                        <option value="pending">Pending</option>
                        <option value="accepted">Accepted</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>
            </div>

            <div class="requests-list" id="requestsList">
                <!-- Requests will be loaded dynamically here -->
            </div>
        </main>
    </div>

    <script src="/javascripts/tailor-dashboard.js"></script>
    <script>
        let currentUserId = null;

        // Get current user ID from session
        async function getCurrentUserId() {
            try {
                const response = await fetch('/api/profile');
                if (!response.ok) {
                    throw new Error('Failed to fetch user profile');
                }
                const user = await response.json();
                currentUserId = user._id;
                return user._id;
            } catch (error) {
                console.error('Error fetching user profile:', error);
                return null;
            }
        }

        async function loadRequests(status = 'all') {
            try {
                const userId = await getCurrentUserId();
                if (!userId) {
                    throw new Error('User not authenticated');
                }

                const response = await fetch(`/api/requests/tailor/${userId}?status=${status}`, {
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    throw new Error('Failed to fetch requests');
                }
                
                const requests = await response.json();
                displayRequests(requests);
            } catch (error) {
                console.error('Error loading requests:', error);
                alert('Failed to load requests. Please try again.');
            }
        }

        function displayRequests(requests) {
            const requestsList = document.getElementById('requestsList');
            requestsList.innerHTML = '';

            if (requests.length === 0) {
                requestsList.innerHTML = `
                    <div class="text-center p-4">
                        <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                        <p class="text-muted">No requests found</p>
                    </div>
                `;
                return;
            }

            requests.forEach(request => {
                const requestCard = document.createElement('div');
                requestCard.className = 'request-card';
                requestCard.innerHTML = `
                    <div class="request-header">
                        <div class="user-info">
                            <img src="${request.customer.profilePicture || '/images/default-profile.png'}" 
                                 alt="User" class="user-avatar">
                            <div>
                                <h3>${request.customer.fullname}</h3>
                                <p class="request-date">Requested on: ${new Date(request.createdAt).toLocaleDateString()}</p>
                            </div>
                        </div>
                        <span class="status-badge ${request.status}">${request.status.charAt(0).toUpperCase() + request.status.slice(1)}</span>
                    </div>
                    <div class="request-details">
                        <h4>Request Details</h4>
                        <p><strong>Location:</strong> ${request.location}</p>
                        <p><strong>Price Range:</strong> ${request.priceRange}</p>
                        <p><strong>Description:</strong> ${request.description}</p>
                        ${request.message ? `<p><strong>Additional Message:</strong> ${request.message}</p>` : ''}
                        
                        ${request.images && request.images.length > 0 ? `
                            <div class="request-images mt-3">
                                <h5>Images</h5>
                                <div class="d-flex gap-2">
                                    ${request.images.map(image => `
                                        <img src="${image}" alt="Request Image" class="img-thumbnail" style="width: 100px; height: 100px; object-fit: cover;">
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                    <div class="request-actions">
                        ${request.status === 'pending' ? `
                            <button class="accept-btn" onclick="handleRequest('accept', '${request._id}')">Accept Request</button>
                            <button class="reject-btn" onclick="handleRequest('reject', '${request._id}')">Reject Request</button>
                        ` : ''}
                    </div>
                `;
                requestsList.appendChild(requestCard);
            });
        }

        async function handleRequest(action, requestId) {
            try {
                const response = await fetch(`/api/requests/${requestId}/status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        status: action === 'accept' ? 'accepted' : 'rejected'
                    }),
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error('Failed to update request status');
                }

                // Reload requests with current filter
                const currentStatus = document.getElementById('statusFilter').value;
                loadRequests(currentStatus);
            } catch (error) {
                console.error('Error handling request:', error);
                alert('Failed to update request status. Please try again.');
            }
        }

        // Add event listener for status filter
        document.getElementById('statusFilter').addEventListener('change', function() {
            loadRequests(this.value);
        });

        // Load requests when page loads
        document.addEventListener('DOMContentLoaded', () => {
            loadRequests();
        });
    </script>
</body>

</html>
