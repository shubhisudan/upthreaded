<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailor Profile - UpThreaded</title>
    <link rel="stylesheet" href="/stylesheets/style.css">
    <link rel="stylesheet" href="/stylesheets/tailor-dashboard.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement(
                { pageLanguage: 'en', includedLanguages: 'hi,ta,te,kn,ml,bn,gu,mr,pa,ur' },
                'google_translate_element'
            );
        }
    </script>
    <script type="text/javascript"
        src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <style>
        /* Additional styles for design section */
        .design-upload-container {
            margin-bottom: 20px;
            padding: 15px;
            border: 2px dashed #3498db;
            border-radius: 8px;
            background-color: #f8f9fa;
        }

        .design-upload-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .designs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .design-card {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            background-color: white;
            transition: transform 0.3s ease;
        }

        .design-card:hover {
            transform: translateY(-5px);
        }

        .design-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .design-card-title {
            padding: 10px;
            font-weight: bold;
            text-align: center;
        }

        .delete-design {
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: rgba(255, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .no-designs-message {
            text-align: center;
            padding: 20px;
            color: #666;
            font-style: italic;
        }

        .hidden {
            display: none;
        }

        /* Modal container */
        .modal {
            display: none;
            /* Hidden by default */
            position: fixed;
            /* Stay in place */
            z-index: 1;
            /* Sit on top */
            left: 0;
            top: 0;
            width: 100%;
            /* Full width */
            height: 100%;
            /* Full height */
            overflow: auto;
            /* Enable scroll if needed */
            background-color: rgb(0, 0, 0);
            /* Fallback color */
            background-color: rgba(0, 0, 0, 0.4);
            /* Black w/ opacity */
        }

        /* Modal content */
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            /* 15% from the top and centered */
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            /* Could be more or less, depending on screen size */
        }

        /* Close button */
        .close-btn {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close-btn:hover,
        .close-btn:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

        @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap');

        :root {
            --primary-color: #285A84;
            --secondary-color: #1d4361;
            --accent-color: #4CAF50;
            --text-color: #333;
            --light-bg: #f8f9fa;
        }

        /* Google Translate Styles */
        .goog-te-gadget {
            font-family: 'Ubuntu', sans-serif !important;
            text-transform: none !important;
        }

        .goog-te-gadget-simple {
            background-color: transparent !important;
            border: 1px solid rgba(255, 255, 255, 0.5) !important;
            padding: 8px !important;
            border-radius: 4px !important;
            cursor: pointer !important;
        }

        .goog-te-menu-value {
            color: white !important;
            text-decoration: none !important;
        }

        .goog-te-menu-value span {
            color: white !important;
        }

        .goog-te-menu-value:hover {
            text-decoration: none !important;
        }

        .goog-te-gadget .goog-te-combo {
            background-color: transparent !important;
            color: rgb(0, 0, 0) !important;
            border: none !important;
            padding: 5px !important;
        }

        .goog-te-banner-frame {
            display: none !important;
        }

        body {
            top: 0 !important;
        }
    </style>
</head>

<body class="bg-light">
    <div class="dashboard-container">
        <nav class="dashboard-nav">
            <div class="nav-logo">Upthreaded</div>
            <ul class="nav-links">
                <li><a href="profile.html" class="active">Profile</a></li>
                <li><a href="requests.html">Requests</a></li>
                <li><a href="orders.html">Orders</a></li>
                <li><a href="/tailor">Back to Main</a></li>
                <li><a href="/logout" class="logout-link">Logout</a></li>
                <li>
                    <div id="google_translate_element"></div>
                </li>
            </ul>
        </nav>

        <main class="dashboard-content">
            <div class="container py-4">
                <div class="row">
                    <div class="col-12">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body">
                                <h4 class="card-title mb-4">Profile Information</h4>
                                <form id="profileForm">
                                    <!-- Profile Picture Section -->
                                    <div class="text-center mb-4">
                                        <div class="position-relative d-inline-block">
                                            <img id="profileImage" src="/images/default-profile.png"
                                                class="rounded-circle profile-image" width="150" height="150"
                                                alt="Profile Picture">
                                            <label for="profilePictureUpload"
                                                class="position-absolute bottom-0 end-0 bg-success rounded-circle p-2 cursor-pointer">
                                                <i class="fas fa-camera text-white"></i>
                                            </label>
                                            <input type="file" id="profilePictureUpload" class="d-none"
                                                accept="image/*">
                                        </div>
                                    </div>

                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label class="form-label">Full Name</label>
                                            <input type="text" class="form-control" id="fullname" readonly>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Email</label>
                                            <input type="email" class="form-control" id="email" readonly>
                                        </div>
                                    </div>
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label class="form-label">Phone Number</label>
                                            <input type="text" class="form-control" id="phone" readonly>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Location</label>
                                            <input type="text" class="form-control" id="location">
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Bio</label>
                                        <textarea class="form-control" id="bio" rows="3"></textarea>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Specialization</label>
                                        <input type="text" class="form-control" id="priceRange"
                                            placeholder="e.g. sarees, kurta, etc.">
                                    </div>
                                    <div class="d-grid gap-2">
                                        <button type="submit" class="btn btn-success">Update Profile</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sample Designs Section -->
                <div class="row mt-4">
                    <div class="col-12">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body">
                                <h4 class="card-title mb-4">Sample Designs</h4>
                                <div class="design-upload-container">
                                    <h3>Add New Design</h3>
                                    <form id="designUploadForm" class="design-upload-form">
                                        <div>
                                            <label for="designTitle">Design Title:</label>
                                            <input type="text" id="designTitle" class="form-control"
                                                placeholder="e.g. Wedding Suit, Formal Dress">
                                        </div>
                                        <div>
                                            <label for="designImage">Design Image:</label>
                                            <input type="file" id="designImage" accept="image/*" class="form-control">
                                        </div>
                                        <button type="submit" class="btn btn-primary">Upload Design</button>
                                    </form>
                                </div>

                                <div class="designs-container">
                                    <p id="noDesignsMessage" class="no-designs-message">No sample designs added yet.</p>
                                    <div id="designsGrid" class="designs-grid"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/javascripts/tailor-dashboard.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const profileForm = document.getElementById('profileForm');
            const profilePictureUpload = document.getElementById('profilePictureUpload');
            const profileImage = document.getElementById('profileImage');
            const designsGrid = document.getElementById('designsGrid');
            const noDesignsMessage = document.getElementById('noDesignsMessage');
            const designUploadForm = document.getElementById('designUploadForm');

            // Fetch tailor profile data
            async function fetchTailorProfile() {
                try {
                    const response = await fetch('/api/tailor-profile');
                    if (!response.ok) {
                        throw new Error('Failed to fetch profile data');
                    }

                    const data = await response.json();

                    // Update profile display with fetched data
                    document.getElementById('fullname').value = data.fullname || 'Name not set';
                    document.getElementById('email').value = data.email || 'Email not set';
                    document.getElementById('phone').value = data.phone || 'Phone not set';
                    document.getElementById('location').value = data.location || '';
                    document.getElementById('bio').value = data.bio || '';
                    document.getElementById('priceRange').value = data.priceRange || '';

                    if (data.profilePicture) {
                        profileImage.src = data.profilePicture;
                    }

                    // Display designs
                    updateDesignsDisplay(data.designs || []);

                } catch (error) {
                    console.error('Error fetching profile:', error);
                    alert('Failed to load profile data');
                }
            }

            // Update designs display
            function updateDesignsDisplay(designs) {
                designsGrid.innerHTML = '';

                if (designs && designs.length > 0) {
                    noDesignsMessage.style.display = 'none';

                    designs.forEach(design => {
                        const designCard = document.createElement('div');
                        designCard.className = 'design-card';
                        designCard.dataset.id = design._id;

                        const img = document.createElement('img');
                        img.src = design.imageUrl;
                        img.alt = design.title;

                        const title = document.createElement('div');
                        title.className = 'design-card-title';
                        title.textContent = design.title;

                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = 'delete-design';
                        deleteBtn.innerHTML = '&times;';
                        deleteBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            deleteDesign(design._id);
                        });

                        designCard.appendChild(img);
                        designCard.appendChild(title);
                        designCard.appendChild(deleteBtn);
                        designsGrid.appendChild(designCard);
                    });
                } else {
                    noDesignsMessage.style.display = 'block';
                }
            }

            // Handle profile picture upload
            profilePictureUpload.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (file.size > 5 * 1024 * 1024) { // 5MB limit
                    alert('Image size should be less than 5MB');
                    return;
                }

                // Show preview
                const reader = new FileReader();
                reader.onload = (e) => {
                    profileImage.src = e.target.result;
                };
                reader.readAsDataURL(file);

                // Upload to server
                const formData = new FormData();
                formData.append('profilePicture', file);

                try {
                    const response = await fetch('/api/tailor-profile', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error('Failed to upload profile picture');
                    }
                } catch (error) {
                    console.error('Error uploading profile picture:', error);
                    alert('Failed to upload profile picture');
                }
            });

            // Handle form submission
            profileForm.addEventListener('submit', async function (e) {
                e.preventDefault();

                const formData = new FormData();
                formData.append('location', document.getElementById('location').value);
                formData.append('bio', document.getElementById('bio').value);
                formData.append('priceRange', document.getElementById('priceRange').value);

                // Add profile picture if selected
                const profilePictureFile = profilePictureUpload.files[0];
                if (profilePictureFile) {
                    formData.append('profilePicture', profilePictureFile);
                }

                try {
                    const response = await fetch('/api/tailor-profile', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) throw new Error('Failed to update profile');

                    alert('Profile updated successfully!');
                    fetchTailorProfile();
                } catch (error) {
                    console.error('Error updating profile:', error);
                    alert('Failed to update profile');
                }
            });

            // Design upload
            designUploadForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const designTitle = document.getElementById('designTitle').value.trim();
                const designImage = document.getElementById('designImage').files[0];

                if (!designImage) {
                    alert('Please select an image to upload');
                    return;
                }

                if (designImage.size > 5 * 1024 * 1024) { // 5MB limit
                    alert('Image size should be less than 5MB');
                    return;
                }

                const formData = new FormData();
                formData.append('designImage', designImage);
                formData.append('title', designTitle || 'Untitled Design');

                try {
                    const response = await fetch('/api/tailor-profile/designs', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error('Failed to upload design');
                    }

                    // Clear form
                    document.getElementById('designTitle').value = '';
                    document.getElementById('designImage').value = '';

                    // Refresh profile data
                    fetchTailorProfile();

                } catch (error) {
                    console.error('Error uploading design:', error);
                    alert('Failed to upload design');
                }
            });

            // Delete design
            async function deleteDesign(designId) {
                if (!confirm('Are you sure you want to delete this design?')) {
                    return;
                }

                try {
                    const response = await fetch(`/api/tailor-profile/designs/${designId}`, {
                        method: 'DELETE'
                    });

                    if (!response.ok) {
                        throw new Error('Failed to delete design');
                    }

                    // Refresh profile data
                    fetchTailorProfile();

                } catch (error) {
                    console.error('Error deleting design:', error);
                    alert('Failed to delete design');
                }
            }

            // Load profile data
            fetchTailorProfile();
        });
    </script>
</body>

</html>
