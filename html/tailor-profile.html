<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailor Profile - UpThreaded</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/stylesheets/style.css">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement(
                { pageLanguage: 'en', includedLanguages: 'hi,ta,te,kn,ml,bn,gu,mr,pa,ur' },
                'google_translate_element'
            );
        }
    </script>
    <script type="text/javascript"
        src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap');

        :root {
            --primary-color: #285A84;
            --secondary-color: #1d4361;
            --accent-color: #4CAF50;
            --text-color: #333;
            --light-bg: #f8f9fa;
        }

        /* Google Translate Styles */
        .goog-te-gadget {
            font-family: 'Ubuntu', sans-serif !important;
            text-transform: none !important;
        }

        .goog-te-gadget-simple {
            background-color: transparent !important;
            border: 1px solid rgba(255, 255, 255, 0.5) !important;
            padding: 8px !important;
            border-radius: 4px !important;
            cursor: pointer !important;
        }

        .goog-te-menu-value {
            color: white !important;
            text-decoration: none !important;
        }

        .goog-te-menu-value span {
            color: white !important;
        }

        .goog-te-menu-value:hover {
            text-decoration: none !important;
        }

        .goog-te-gadget .goog-te-combo {
            background-color: transparent !important;
            color: white !important;
            border: none !important;
            padding: 5px !important;
        }

        .goog-te-banner-frame {
            display: none !important;
        }

        body {
            top: 0 !important;
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <nav class="dashboard-nav">
            <div class="nav-logo">Upthreaded</div>
            <ul class="nav-links">
                <li><a href="/tailor-dashboard/profile.html" class="active">Profile</a></li>
                <li><a href="/tailor-dashboard/requests.html">Requests</a></li>
                <li><a href="/tailor-dashboard/orders.html">Orders</a></li>
                <li><a href="/tailor">Back to Main</a></li>
                <li><a href="/logout" class="logout-link">Logout</a></li>
                <li>
                    <div id="google_translate_element"></div>
                </li>
            </ul>
        </nav>

        <main class="dashboard-content">
            <div class="container py-4">
                <div class="row">
                    <div class="col-12">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body">
                                <h4 class="card-title mb-4">Profile Information</h4>
                                <form id="profileForm">
                                    <!-- Profile Picture Section -->
                                    <div class="text-center mb-4">
                                        <div class="position-relative d-inline-block">
                                            <img id="profileImage" src="/images/default-profile.png"
                                                class="rounded-circle profile-image" width="150" height="150"
                                                alt="Profile Picture">
                                            <label for="profilePictureUpload"
                                                class="position-absolute bottom-0 end-0 bg-success rounded-circle p-2 cursor-pointer">
                                                <i class="fas fa-camera text-white"></i>
                                            </label>
                                            <input type="file" id="profilePictureUpload" class="d-none"
                                                accept="image/*">
                                        </div>
                                    </div>

                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label class="form-label">Full Name</label>
                                            <input type="text" class="form-control" id="fullname" readonly>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Email</label>
                                            <input type="email" class="form-control" id="email" readonly>
                                        </div>
                                    </div>
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label class="form-label">Phone Number</label>
                                            <input type="text" class="form-control" id="phone" readonly>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Location</label>
                                            <input type="text" class="form-control" id="location">
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Bio</label>
                                        <textarea class="form-control" id="bio" rows="3"></textarea>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Specialization</label>
                                        <input type="text" class="form-control" id="priceRange"
                                            placeholder="e.g. sarees, kurta, etc.">
                                    </div>
                                    <div class="d-grid gap-2">
                                        <button type="submit" class="btn btn-success">Update Profile</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sample Designs Section -->
                <div class="row mt-4">
                    <div class="col-12">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body">
                                <h4 class="card-title mb-4">Sample Designs</h4>
                                <div class="design-upload-container">
                                    <h3>Add New Design</h3>
                                    <form id="designUploadForm" class="design-upload-form">
                                        <div>
                                            <label for="designTitle">Design Title:</label>
                                            <input type="text" id="designTitle" class="form-control"
                                                placeholder="e.g. Wedding Suit, Formal Dress">
                                        </div>
                                        <div>
                                            <label for="designImage">Design Image:</label>
                                            <input type="file" id="designImage" accept="image/*" class="form-control">
                                        </div>
                                        <button type="submit" class="btn btn-primary">Upload Design</button>
                                    </form>
                                </div>

                                <div class="designs-container">
                                    <p id="noDesignsMessage" class="no-designs-message">No sample designs added yet.</p>
                                    <div id="designsGrid" class="designs-grid"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/javascripts/tailor-dashboard.js"></script>
</body>

</html>
