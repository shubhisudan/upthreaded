<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tailor Profile - UpThreaded</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="stylesheet" href="/stylesheets/style.css" />
  <link rel="stylesheet" href="/stylesheets/user-navbar.css" />
  <link rel="icon" type="image/png" href="/images/logo.png" />
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement(
        { pageLanguage: 'en', includedLanguages: 'hi,ta,te,kn,ml,bn,gu,mr,pa,ur' },
        'google_translate_element'
      );
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap');

    :root {
      --primary-color: #285A84;
      --secondary-color: #1d4361;
      --accent-color: #4CAF50;
      --text-color: #333;
      --light-bg: #f8f9fa;
    }

    .goog-te-gadget {
      font-family: 'Ubuntu', sans-serif !important;
      text-transform: none !important;
    }

    .goog-te-gadget-simple {
      background-color: transparent !important;
      border: 1px solid rgba(255, 255, 255, 0.5) !important;
      padding: 8px !important;
      border-radius: 4px !important;
      cursor: pointer !important;
    }

    .goog-te-menu-value {
      color: white !important;
      text-decoration: none !important;
    }

    .goog-te-menu-value span {
      color: white !important;
    }

    .goog-te-gadget .goog-te-combo {
      background-color: transparent !important;
      color: white !important;
      border: none !important;
      padding: 5px !important;
    }

    .goog-te-banner-frame {
      display: none !important;
    }

    body {
      top: 0 !important;
    }

    .profile-header {
      background-color: var(--light-bg);
      padding: 3rem 0;
      margin-bottom: 2rem;
    }

    .profile-image {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      border: 5px solid white;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .design-card {
      transition: transform 0.3s, box-shadow 0.3s;
      border-radius: 8px;
      overflow: hidden;
      height: 100%;
    }

    .design-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }

    .design-image {
      height: 250px;
      object-fit: cover;
    }

    .contact-info {
      background-color: white;
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
    }

    .contact-info i {
      color: var(--primary-color);
      margin-right: 10px;
    }

    .request-button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 30px;
      font-weight: 500;
      transition: background-color 0.3s;
    }

    .request-button:hover {
      background-color: #3d8b40;
      color: white;
    }
  </style>
</head>

<body>
  <script src="/javascripts/navbar-loader.js"></script>

  <div class="profile-header">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-3 text-center">
          <img id="profile-image" src="/images/default-profile.png" alt="Profile Picture" class="profile-image mb-3" />
        </div>
        <div class="col-md-9">
          <h1 id="tailor-name" class="mb-2">Loading...</h1>
          <p id="tailor-location" class="text-muted mb-3"><i class="fas fa-map-marker-alt"></i> Loading...</p>
          <p id="tailor-bio" class="lead mb-3">Loading...</p>
          <div class="mt-4">
            <button id="request-button" class="request-button" data-bs-toggle="modal" data-bs-target="#requestModal">
              <i class="fas fa-envelope me-2"></i> Send Request
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <div class="col-md-4 mb-4">
        <div class="contact-info">
          <h4 class="mb-3">Information</h4>
          <p><i class="fas fa-map-marker-alt"></i> <span id="tailor-location-detail">Loading...</span></p>
          <p><i class="fas fa-tag"></i> <span id="tailor-price-range">Loading...</span></p>
        </div>
      </div>
      <div class="col-md-8">
        <h3 class="mb-4">Sample Designs</h3>
        <div class="row" id="designs-container">
          <div class="col-12 text-center">
            <p class="text-muted">Loading designs...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Request Modal -->
  <div class="modal fade" id="requestModal" tabindex="-1" aria-labelledby="requestModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="requestModalLabel">Send Request</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="tailorId" />
          <div class="mb-3">
            <label for="requestMessage" class="form-label">Message</label>
            <textarea class="form-control" id="requestMessage" rows="2"></textarea>
          </div>
          <div class="mb-3">
            <label for="location" class="form-label">Your Location</label>
            <input type="text" class="form-control" id="location" />
          </div>
          <div class="mb-3">
            <label for="priceRange" class="form-label">Price Range</label>
            <input type="text" class="form-control" id="priceRange" />
          </div>
          <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" rows="3"></textarea>
          </div>
          <div class="mb-3">
            <label for="imageUpload" class="form-label">Upload Images</label>
            <input type="file" class="form-control" id="imageUpload" multiple />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-success" id="submitRequest">Submit</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const urlParams = new URLSearchParams(window.location.search);
      const tailorId = urlParams.get('id');
      document.getElementById('tailorId').value = tailorId;

      if (!tailorId) {
        window.location.href = '/';
        return;
      }

      fetch(`/api/tailor/${tailorId}`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('tailor-name').textContent = data.fullname;
          document.getElementById('tailor-location').textContent = data.location || 'Location not specified';
          document.getElementById('tailor-location-detail').textContent = data.location || 'Location not specified';
          document.getElementById('tailor-bio').textContent = data.bio || 'No bio available';
          document.getElementById('tailor-price-range').textContent = data.priceRange || 'Price range not specified';
          if (data.profilePicture) document.getElementById('profile-image').src = data.profilePicture;

          const designsContainer = document.getElementById('designs-container');
          if (data.designs && data.designs.length > 0) {
            designsContainer.innerHTML = data.designs.map(design => `
              <div class="col-md-6 mb-4">
                <div class="card design-card">
                  <img src="${design.imageUrl}" class="card-img-top design-image" alt="${design.title}">
                  <div class="card-body">
                    <h5 class="card-title">${design.title}</h5>
                    <p class="card-text">${design.description || 'No description available'}</p>
                  </div>
                </div>
              </div>
            `).join('');
          } else {
            designsContainer.innerHTML = '<div class="col-12"><p class="text-center">No designs available</p></div>';
          }
        })
        .catch(err => {
          console.error('Failed to load tailor:', err);
          alert('Error loading tailor data');
        });

      document.getElementById('submitRequest').addEventListener('click', async () => {
        try {
          const tailorId = document.getElementById('tailorId').value;
          const message = document.getElementById('requestMessage').value;
          const location = document.getElementById('location').value;
          const priceRange = document.getElementById('priceRange').value;
          const description = document.getElementById('description').value;
          const images = document.getElementById('imageUpload').files;

          
          const formData = new FormData();
          formData.append('tailorId', tailorId);
          formData.append('message', message);
          formData.append('location', location);
          formData.append('priceRange', priceRange);
          formData.append('description', description);

          for (let i = 0; i < images.length; i++) {
            formData.append('images', images[i]);
          }

          const response = await fetch('/api/request', {
            method: 'POST',
            body: formData
          });

          if (response.ok) {
            alert('Request sent successfully!');
            document.getElementById('requestMessage').value = '';
            document.getElementById('location').value = '';
            document.getElementById('priceRange').value = '';
            document.getElementById('description').value = '';
            document.getElementById('imageUpload').value = '';
            const modal = bootstrap.Modal.getInstance(document.getElementById('requestModal'));
            modal.hide();
          } else {
            const error = await response.text();
            alert('Failed to send request: ' + error);
          }
        } catch (error) {
          console.error('Error submitting request:', error);
          alert('An error occurred. Please try again.');
        }
      });
    });
  </script>
</body>

</html>
