<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailor Profile - UpThreaded</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <style>
        body {
            font-family: 'Ubuntu', sans-serif;
            background-color: #f8f9fa;
        }

        .navbar {
            background-color: #285A84;
            padding: 15px 0;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
            font-size: 24px;
        }

        .navbar-brand img {
            width: 45px;
            margin-right: 15px;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.9) !important;
            font-size: 16px;
            padding: 8px 20px !important;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: white !important;
        }

        .container {
            max-width: 1200px;
            padding: 30px;
        }

        .card {
            border: none;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
            border-radius: 8px;
        }

        .profile-header {
            background-color: #285A84;
            color: white;
            padding: 30px;
            border-radius: 8px 8px 0 0;
        }

        .profile-picture {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid white;
            object-fit: cover;
        }

        .designs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .design-card {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            background-color: white;
            transition: transform 0.3s ease;
        }

        .design-card:hover {
            transform: translateY(-5px);
        }

        .design-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .design-card-title {
            padding: 10px;
            font-weight: bold;
            text-align: center;
        }

        .btn-success {
            background-color: #285A84;
            border-color: #285A84;
        }

        .btn-success:hover {
            background-color: #1d4361;
            border-color: #1d4361;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <img src="/images/logo.png" alt="Logo">
                UpThreaded
            </a>
            <div class="d-flex align-items-center">
                <a href="/user.html" class="btn btn-outline-light">
                    <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="profile-header text-center">
                        <img id="tailorProfilePicture" src="/images/default-profile.png" class="profile-picture mb-3"
                            alt="Profile Picture">
                        <h2 id="tailorName" class="mb-2">Loading...</h2>
                        <p id="tailorLocation" class="mb-0"><i class="fas fa-map-marker-alt me-2"></i>Loading...</p>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-8">
                                <h4 class="mb-3">About</h4>
                                <p id="tailorBio" class="mb-4">Loading...</p>

                                <h4 class="mb-3">Specialization</h4>
                                <p id="tailorPriceRange" class="mb-4">Loading...</p>

                                <button id="sendRequestBtn" class="btn btn-success btn-lg">
                                    <i class="fas fa-paper-plane me-2"></i>Send Request
                                </button>
                            </div>
                            <div class="col-md-4">
                                <h4 class="mb-3">Sample Designs</h4>
                                <div id="designsGrid" class="designs-grid">
                                    <div class="text-center p-4 text-muted">
                                        <i class="fas fa-info-circle mb-2" style="font-size: 2rem;"></i>
                                        <p>No sample designs available</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const urlParams = new URLSearchParams(window.location.search);
            const tailorId = urlParams.get('id');

            if (!tailorId) {
                window.location.href = '/user';
                return;
            }

            // Fetch tailor profile data
            async function fetchTailorProfile() {
                try {
                    const response = await fetch(`/api/tailor/${tailorId}`);
                    if (!response.ok) {
                        throw new Error('Failed to fetch profile data');
                    }

                    const tailor = await response.json();

                    // Update profile display
                    document.getElementById('tailorName').textContent = tailor.fullname;
                    document.getElementById('tailorLocation').innerHTML = `<i class="fas fa-map-marker-alt me-2"></i>${tailor.location || 'Location not specified'}`;
                    document.getElementById('tailorBio').textContent = tailor.bio || 'No bio available';
                    document.getElementById('tailorPriceRange').textContent = tailor.priceRange || 'Price range not specified';

                    if (tailor.profilePicture) {
                        document.getElementById('tailorProfilePicture').src = tailor.profilePicture;
                    }

                    // Display designs
                    updateDesignsDisplay(tailor.designs || []);

                } catch (error) {
                    console.error('Error fetching profile:', error);
                    alert('Failed to load profile data');
                }
            }

            // Update designs display
            function updateDesignsDisplay(designs) {
                const designsGrid = document.getElementById('designsGrid');
                designsGrid.innerHTML = '';

                if (designs && designs.length > 0) {
                    designs.forEach(design => {
                        const designCard = document.createElement('div');
                        designCard.className = 'design-card';

                        const img = document.createElement('img');
                        img.src = design.imageUrl;
                        img.alt = design.title;

                        const title = document.createElement('div');
                        title.className = 'design-card-title';
                        title.textContent = design.title;

                        designCard.appendChild(img);
                        designCard.appendChild(title);
                        designsGrid.appendChild(designCard);
                    });
                } else {
                    designsGrid.innerHTML = `
                        <div class="text-center p-4 text-muted">
                            <i class="fas fa-info-circle mb-2" style="font-size: 2rem;"></i>
                            <p>No sample designs available</p>
                        </div>
                    `;
                }
            }

            // Handle send request button click
            document.getElementById('sendRequestBtn').addEventListener('click', function () {
                window.location.href = `/user?tailorId=${tailorId}`;
            });

            // Load profile data
            fetchTailorProfile();
        });
    </script>
</body>

</html>
