<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailor Dashboard</title>
    <link rel="stylesheet" href="/stylesheets/style.css">
    <link rel="stylesheet" href="/stylesheets/tailor-dashboard.css">
</head>

<body>
    <div class="dashboard-container">
        <nav class="dashboard-nav">
            <div class="nav-logo">Upthreaded</div>
            <ul class="nav-links">
                <li><a href="/tailor-dashboard/profile.html">Profile</a></li>
                <li><a href="/tailor-dashboard/requests.html">Requests</a></li>
                <li><a href="/tailor-dashboard/orders.html">Orders</a></li>
                <li><a href="/logout" class="logout-link">Logout</a></li>
            </ul>
        </nav>

        <main class="dashboard-content">
            <div class="welcome-section">
                <h1>Welcome to Your Tailor Dashboard</h1>
                <p>Manage your profile, requests, and orders all in one place.</p>

                <div class="quick-stats">
                    <div class="stat-card">
                        <h3>Pending Requests</h3>
                        <p class="stat-number" id="pendingRequests">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Active Orders</h3>
                        <p class="stat-number" id="activeOrders">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Completed Orders</h3>
                        <p class="stat-number" id="completedOrders">0</p>
                    </div>
                </div>

                <div class="quick-actions">
                    <a href="/tailor-dashboard/profile.html" class="action-button">
                        <span class="icon">👤</span>
                        Edit Profile
                    </a>
                    <a href="/tailor-dashboard/requests.html" class="action-button">
                        <span class="icon">📝</span>
                        View Requests
                    </a>
                    <a href="/tailor-dashboard/orders.html" class="action-button">
                        <span class="icon">📦</span>
                        Manage Orders
                    </a>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Function to fetch and update statistics
        async function fetchStatistics() {
            try {
                const response = await fetch('/api/tailor/stats');
                if (!response.ok) {
                    throw new Error('Failed to fetch statistics');
                }
                const stats = await response.json();

                // Update the statistics in the UI, defaulting to 0 if undefined
                document.getElementById('pendingRequests').textContent = stats.pendingRequests || 0;
                document.getElementById('activeOrders').textContent = stats.activeOrders || 0;
                document.getElementById('completedOrders').textContent = stats.completedOrders || 0;
            } catch (error) {
                console.error('Error fetching statistics:', error);
                // Set all stats to 0 on error
                document.getElementById('pendingRequests').textContent = '0';
                document.getElementById('activeOrders').textContent = '0';
                document.getElementById('completedOrders').textContent = '0';
            }
        }

        // Fetch statistics when the page loads
        document.addEventListener('DOMContentLoaded', fetchStatistics);

        // Refresh statistics every 30 seconds
        setInterval(fetchStatistics, 30000);
    </script>
</body>

</html>
