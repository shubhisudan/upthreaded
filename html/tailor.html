<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailor Dashboard - UpThreaded</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/stylesheets/tailor-dashboard.css">
    <link rel="stylesheet" href="/stylesheets/style.css">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement(
                { pageLanguage: 'en', includedLanguages: 'hi,ta,te,kn,ml,bn,gu,mr,pa,ur' },
                'google_translate_element'
            );
        }
    </script>
    <script type="text/javascript"
        src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap');

        :root {
            --primary-color: #285A84;
            --secondary-color: #1d4361;
            --accent-color: #4CAF50;
            --text-color: #333;
            --light-bg: #f8f9fa;
        }

        /* Google Translate Styles */
        .goog-te-gadget {
            font-family: 'Ubuntu', sans-serif !important;
            text-transform: none !important;
        }

        .goog-te-gadget-simple {
            background-color: transparent !important;
            border: 1px solid rgba(255, 255, 255, 0.5) !important;
            padding: 8px !important;
            border-radius: 4px !important;
            cursor: pointer !important;
        }

        .goog-te-menu-value {
            color: white !important;
            text-decoration: none !important;
        }

        .goog-te-menu-value span {
            color: white !important;
        }

        .goog-te-menu-value:hover {
            text-decoration: none !important;
        }

        .goog-te-gadget .goog-te-combo {
            background-color: transparent !important;
            color: rgb(0, 0, 0) !important;
            border: none !important;
            padding: 5px !important;
        }

        .goog-te-banner-frame {
            display: none !important;
        }

        body {
            top: 0 !important;
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <nav class="dashboard-nav">
            <div class="nav-logo">Upthreaded</div>
            <ul class="nav-links">
                <li><a href="/tailor-dashboard/profile.html">Profile</a></li>
                <li><a href="/tailor-dashboard/requests.html">Requests</a></li>
                <li><a href="/tailor-dashboard/orders.html">Orders</a></li>
                <li><a href="/tailor">Back to Main</a></li>
                <li><a href="/logout" class="logout-link">Logout</a></li>
                <li>
                    <div id="google_translate_element"></div>
                </li>
            </ul>
        </nav>

        <main class="dashboard-content">
            <div class="welcome-section">
                <h1>Welcome to Your Tailor Dashboard</h1>
                <p>Manage your profile, requests, and orders all in one place.</p>

                <div class="quick-stats">
                    <div class="stat-card">
                        <h3>Pending Requests</h3>
                        <p class="stat-number">5</p>
                    </div>
                    <div class="stat-card">
                        <h3>Active Orders</h3>
                        <p class="stat-number">3</p>
                    </div>
                    <div class="stat-card">
                        <h3>Completed Orders</h3>
                        <p class="stat-number">12</p>
                    </div>
                </div>

                <div class="quick-actions">
                    <a href="/tailor-dashboard/profile.html" class="action-button">
                        <span class="icon">👤</span>
                        Edit Profile
                    </a>
                    <a href="/tailor-dashboard/requests.html" class="action-button">
                        <span class="icon">📝</span>
                        View Requests
                    </a>
                    <a href="/tailor-dashboard/orders.html" class="action-button">
                        <span class="icon">📦</span>
                        Manage Orders
                    </a>
                </div>
            </div>
        </main>
    </div>

    <script src="/javascripts/tailor-dashboard.js"></script>
    <script>
        let currentUserId = null;

        // Get current user ID from session
        async function getCurrentUserId() {
            try {
                const response = await fetch('/api/profile');
                if (!response.ok) {
                    throw new Error('Failed to fetch user profile');
                }
                const user = await response.json();
                currentUserId = user._id;
                return user._id;
            } catch (error) {
                console.error('Error fetching user profile:', error);
                return null;
            }
        }

        async function updatePendingRequestsCount() {
            try {
                const userId = await getCurrentUserId();
                if (!userId) {
                    throw new Error('User not authenticated');
                }

                const response = await fetch(`/api/requests/tailor/${userId}?status=pending`, {
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch pending requests');
                }

                const requests = await response.json();
                const pendingRequestsCount = requests.length;

                // Update the pending requests count in the dashboard
                const pendingRequestsElement = document.querySelector('.stat-card:nth-child(1) .stat-number');
                if (pendingRequestsElement) {
                    pendingRequestsElement.textContent = pendingRequestsCount;
                }
            } catch (error) {
                console.error('Error updating pending requests count:', error);
            }
        }

        async function updateActiveOrdersCount() {
            try {
                const userId = await getCurrentUserId();
                if (!userId) {
                    throw new Error('User not authenticated');
                }

                const response = await fetch(`/api/orders/tailor/${userId}?status=all`, {
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch orders');
                }

                const data = await response.json();
                const activeOrders = data.orders ? data.orders.filter(order => 
                    order.status === 'in-progress' || order.status === 'shipped'
                ) : [];
                const activeOrdersCount = activeOrders.length;

                // Update the active orders count in the dashboard
                const activeOrdersElement = document.querySelector('.stat-card:nth-child(2) .stat-number');
                if (activeOrdersElement) {
                    activeOrdersElement.textContent = activeOrdersCount;
                }
            } catch (error) {
                console.error('Error updating active orders count:', error);
            }
        }

        async function updateCompletedOrdersCount() {
            try {
                const userId = await getCurrentUserId();
                if (!userId) {
                    throw new Error('User not authenticated');
                }

                const response = await fetch(`/api/orders/tailor/${userId}?status=delivered`, {
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch delivered orders');
                }

                const data = await response.json();
                const completedOrdersCount = data.orders ? data.orders.length : 0;

                // Update the completed orders count in the dashboard
                const completedOrdersElement = document.querySelector('.stat-card:nth-child(3) .stat-number');
                if (completedOrdersElement) {
                    completedOrdersElement.textContent = completedOrdersCount;
                }
            } catch (error) {
                console.error('Error updating completed orders count:', error);
            }
        }

        // Load counts when page loads
        document.addEventListener('DOMContentLoaded', () => {
            updatePendingRequestsCount();
            updateActiveOrdersCount();
            updateCompletedOrdersCount();
        });
    </script>
</body>

</html>
