<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Orders - UpThreaded</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/stylesheets/style.css">
    <link rel="stylesheet" href="/stylesheets/user-navbar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement(
                { pageLanguage: 'en', includedLanguages: 'hi,ta,te,kn,ml,bn,gu,mr,pa,ur' },
                'google_translate_element'
            );
        }
    </script>
    <script type="text/javascript"
        src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script src="/javascripts/navbar-loader.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap');

        :root {
            --primary-color: #285A84;
            --secondary-color: #1d4361;
            --accent-color: #4CAF50;
            --text-color: #333;
            --light-bg: #f8f9fa;
        }

        /* Google Translate Styles */
        .goog-te-gadget {
            font-family: 'Ubuntu', sans-serif !important;
            text-transform: none !important;
        }

        .goog-te-gadget-simple {
            background-color: transparent !important;
            border: 1px solid rgba(255, 255, 255, 0.5) !important;
            padding: 8px !important;
            border-radius: 4px !important;
            cursor: pointer !important;
        }

        .goog-te-menu-value {
            color: white !important;
            text-decoration: none !important;
        }

        .goog-te-menu-value span {
            color: white !important;
        }

        .goog-te-menu-value:hover {
            text-decoration: none !important;
        }

        .goog-te-gadget .goog-te-combo {
            background-color: transparent !important;
            color: rgb(0, 0, 0) !important;
            border: none !important;
            padding: 5px !important;
        }

        .goog-te-banner-frame {
            display: none !important;
        }

        body {
            top: 0 !important;
        }

        .request-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
        }

        .status-badge {
            padding: 0.5em 1em;
            border-radius: 20px;
            font-weight: 500;
        }

        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }

        .status-accepted {
            background-color: #d4edda;
            color: #155724;
        }

        .status-completed {
            background-color: #d1ecf1;
            color: #0c5460;
        }

        .status-rejected {
            background-color: #f8d7da;
            color: #721c24;
        }

        #loadingSpinner {
            display: none;
        }
    </style>
</head>

<body class="bg-light">
    <!-- Navbar will be loaded here by navbar-loader.js -->

    <!-- Main Content -->
    <div class="container py-4">
        <!-- Orders Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0">My Requests</h4>
            <div class="btn-group" id="statusFilter">
                <button type="button" class="btn btn-outline-primary active" data-status="all">All</button>
                <button type="button" class="btn btn-outline-primary" data-status="pending">Pending</button>
                <button type="button" class="btn btn-outline-primary" data-status="accepted">Accepted</button>
                <button type="button" class="btn btn-outline-primary" data-status="completed">Completed</button>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Loading your requests...</p>
        </div>

        <!-- No Requests Message -->
        <div id="noRequestsMessage" class="text-center py-5 d-none">
            <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
            <h5 class="text-muted">No requests found</h5>
            <p class="text-muted">You haven't made any requests yet.</p>
        </div>

        <!-- Requests List -->
        <div id="requestsList" class="row g-4">
            <!-- Requests will be dynamically inserted here -->
        </div>

        <!-- Pagination -->
        <div class="col-12 mt-4">
            <nav aria-label="Requests pagination">
                <ul class="pagination justify-content-center" id="pagination">
                    <!-- Pagination will be dynamically inserted here -->
                </ul>
            </nav>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            let currentPage = 1;
            let currentStatus = 'all';
            const requestsList = document.getElementById('requestsList');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const noRequestsMessage = document.getElementById('noRequestsMessage');
            const statusFilter = document.getElementById('statusFilter');

            // Function to fetch requests from the API
            async function fetchRequests(page = 1, status = 'all') {
                loadingSpinner.style.display = 'block';
                requestsList.innerHTML = '';
                noRequestsMessage.classList.add('d-none');

                try {
                    const response = await fetch(`/api/requests/user?page=${page}&status=${status}`);
                    if (!response.ok) {
                        throw new Error('Failed to fetch requests');
                    }

                    const data = await response.json();
                    displayRequests(data.requests);
                    updatePagination(data.totalPages, page);
                } catch (error) {
                    console.error('Error fetching requests:', error);
                    requestsList.innerHTML = `
                        <div class="col-12">
                            <div class="alert alert-danger" role="alert">
                                Failed to load requests. Please try again later.
                            </div>
                        </div>
                    `;
                } finally {
                    loadingSpinner.style.display = 'none';
                }
            }

            // Function to display requests
            function displayRequests(requests) {
                if (requests.length === 0) {
                    noRequestsMessage.classList.remove('d-none');
                    return;
                }

                requestsList.innerHTML = requests.map(request => `
                    <div class="col-12">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body">
                                <div class="row align-items-center">
                                    <div class="col-md-2 text-center">
                                        ${request.images && request.images.length > 0
                        ? `<img src="${request.images[0]}" class="request-image" alt="Request Image">`
                        : `<div class="request-image bg-light d-flex align-items-center justify-content-center">
                                                <i class="fas fa-image text-muted"></i>
                                               </div>`
                    }
                                    </div>
                                    <div class="col-md-6">
                                        <h5 class="card-title mb-2">${request.description.substring(0, 50)}${request.description.length > 50 ? '...' : ''}</h5>
                                        <p class="text-muted mb-2">Request #${request._id}</p>
                                        <div class="d-flex gap-3">
                                            <span class="status-badge status-${request.status.toLowerCase()}">${request.status}</span>
                                            <span class="text-muted">Created: ${new Date(request.createdAt).toLocaleDateString()}</span>
                                        </div>
                                    </div>
                                    <div class="col-md-2 text-md-end">
                                        <h5 class="text-primary mb-1">${request.priceRange}</h5>
                                        <p class="text-muted mb-0">${request.location}</p>
                                    </div>
                                    <div class="col-md-2 text-md-end">
                                        <button class="btn btn-outline-primary btn-sm" onclick="viewRequestDetails('${request._id}')">View Details</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            // Function to update pagination
            function updatePagination(totalPages, currentPage) {
                const pagination = document.getElementById('pagination');
                let paginationHTML = '';

                // Previous button
                paginationHTML += `
                    <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                        <a class="page-link" href="#" data-page="${currentPage - 1}">Previous</a>
                    </li>
                `;

                // Page numbers
                for (let i = 1; i <= totalPages; i++) {
                    paginationHTML += `
                        <li class="page-item ${i === currentPage ? 'active' : ''}">
                            <a class="page-link" href="#" data-page="${i}">${i}</a>
                        </li>
                    `;
                }

                // Next button
                paginationHTML += `
                    <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                        <a class="page-link" href="#" data-page="${currentPage + 1}">Next</a>
                    </li>
                `;

                pagination.innerHTML = paginationHTML;
            }

            // Event listener for status filter buttons
            statusFilter.addEventListener('click', function (e) {
                if (e.target.tagName === 'BUTTON') {
                    // Remove active class from all buttons
                    statusFilter.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
                    // Add active class to clicked button
                    e.target.classList.add('active');
                    // Update current status and fetch requests
                    currentStatus = e.target.dataset.status;
                    currentPage = 1;
                    fetchRequests(currentPage, currentStatus);
                }
            });

            // Event listener for pagination
            document.getElementById('pagination').addEventListener('click', function (e) {
                if (e.target.tagName === 'A') {
                    e.preventDefault();
                    const page = parseInt(e.target.dataset.page);
                    if (!isNaN(page)) {
                        currentPage = page;
                        fetchRequests(currentPage, currentStatus);
                    }
                }
            });

            // Function to view request details
            window.viewRequestDetails = function (requestId) {
                window.location.href = `/request-details.html?id=${requestId}`;
            };

            // Initial fetch
            fetchRequests(currentPage, currentStatus);
        });
    </script>
</body>

</html>
